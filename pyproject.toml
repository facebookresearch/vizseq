[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vizseq"
version = "0.2.1"
description = "Visual Analysis Toolkit for Text Generation Tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0,<3.0.0",
    "sacrebleu>=2.0.0,<3.0.0",
    "tqdm>=4.0.0,<5.0.0",
    "nltk>=3.5,<4.0.0",
    "rouge-score>=0.1.2,<0.2.0",
    "langid>=1.1.6,<2.0.0",
    "jinja2>=2.11.0,<4.0.0",
    "IPython>=7.0.0,<10.0.0",
    "matplotlib>=3.3.0,<4.0.0",
    "tornado>=6.0,<7.0",
    "pandas>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
# Modern BERTScore path — supports PyTorch 2.x, Transformers 4.5x+,
# NumPy 1.x/2.x. LASER is legacy and frozen (torch<2, numpy<2) —
# see [laser] extra below.
embeddings = [
    "torch>=1.9.0",
    "transformers>=3.0.0",
    "bert-score>=0.3.13",
]
# Legacy LASER support: laserembeddings 1.1.2 (2020) pins torch<2.0,
# numpy<2.0, sacremoses==0.0.35, etc. Use only if you need the LASER
# scorer:  pip install vizseq[laser]  or  pip install vizseq[embeddings,laser]
laser = [
    "torch>=1.9.0,<2.0.0",
    "numpy<2.0.0",
    "transformers>=3.0.0,<4.46.0",
    "laserembeddings==1.1.2",
    "bert-score>=0.3.13",
]
audio = [
    "soundfile>=0.10.0,<1.0.0",
]
translate = [
    "google-cloud-translate>=3.0.0,<4.0.0",
]
all = [
    "vizseq[embeddings,audio,translate]",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/vizseq"

[project.scripts]
vizseq-server = "vizseq.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "C"]
ignore = [
    "E501",  # line too long - too many to fix immediately (matches .flake8)
    # E203 is preview-only in ruff; W503 not present in ruff (pycodestyle)
    "B905",  # zip() without strict= - large churn, address separately
    "C901",  # complex-structure - large churn
    "E741",  # ambiguous variable name (l, I, O)
    "B904",  # raise without from - deliberate HTTPError mapping
]
# Keep re-exports in __init__.py as public API (matches .flake8 per-file-ignores)
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.setuptools.packages.find]
include = ["vizseq*"]

[tool.setuptools.package-data]
vizseq = ["_templates/*.html"]

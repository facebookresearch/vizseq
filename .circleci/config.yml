version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout
      - run:
          name: "Install linting tools"
          command: pip install flake8
      - run:
          name: "Run flake8"
          command: flake8 vizseq tests

  py38_mac:
    macos:
      xcode: "14.2.0"
    steps:
      - checkout
      - run:
          name: "Installing Conda"
          command: |
            curl -o Miniconda3-latest-MacOSX-x86_64.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh
            bash ./Miniconda3-latest-MacOSX-x86_64.sh -b
            ~/miniconda3/bin/conda init bash
      - run:
          name: "Installing VizSeq"
          command: |
            ~/miniconda3/bin/conda create -n vizseq38 python=3.8 -q -y
            ~/miniconda3/bin/conda run -n vizseq38 pip install -e .
            bash get_example_data.sh
      - run:
          no_output_timeout: 60m
          command: ~/miniconda3/bin/conda run -n vizseq38 python -m tests.test_n_gram_based_scorers
      - run:
          no_output_timeout: 60m
          command: ~/miniconda3/bin/conda run -n vizseq38 python -m tests.test_embedding_based_scorers
      - run:
          no_output_timeout: 60m
          command: ~/miniconda3/bin/conda run -n vizseq38 python -m tests.test_ipynb

